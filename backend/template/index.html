<!DOCTYPE html>
<html>

<head>

    <title>Movies4All</title>

    <link
        rel="stylesheet"
        href="/styles/search_style.css"
    >

</head>

<body>

    <nav>

        <a href="/">Home</a>

        <a href="/theater-search">
            Theater Search
        </a>

    </nav>

    <div class="card">

        <h1>Movies4All</h1>

        <form action="/movie-search-page" method="get">

            <input
                type="text"
                name="title"
                placeholder="Enter a movie title"
                required
            >

            <button type="submit">
                Search
            </button>

        </form>

    </div>

    <div class="card">

        <h2>Recent Searches</h2>

        <ul>

            {% for search in searches %}

                <li>
                    {{ search.search_value }}
                </li>

            {% endfor %}

        </ul>

    </div>

</body>

</html>
